services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_API_DISABLE_AUTH=true
      - N8N_API_KEY=dev-key
      - N8N_HOST=0.0.0.0
      - N8N_PROTOCOL=http
      - WEBHOOK_TUNNEL_URL=http://localhost:5678/
    volumes:
      - n8n_storage:/home/node/.n8n
    networks:
      - n8n-network

  node_app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./packages/workflow-service/.env.development
    environment:
      - N8N_URL=http://n8n:5678
      - PORT=3000
      - NODE_ENV=development
    depends_on:
      - n8n
    networks:
      - n8n-network
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  n8n_storage:

networks:
  n8n-network:
    driver: bridge
